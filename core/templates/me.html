{% extends 'base.html' %}

{% block me %}
    <li class="nav-item">
        <a class="nav-link active text-1 fs-5" href="{% url 'me' %}">Me </a>
    </li>
{% endblock me %}

{% block content %}
<meta name="csrf-token" content="{{ csrf_token }}">
<div class="me-page">
    <div class="me-grid">
        {% for item in media %}
            <figure class="me-card">
                <button type="button" class="me-card-btn" data-kind="{{ item.kind }}"
                        data-name="{{ item.name }}" data-full="{{ item.src }}"
                        data-alt="{{ item.alt }}"
                        aria-label="Open {{ item.alt }}">
                    {% if item.kind == 'video' %}
                        <video class="me-media" data-src="{{ item.src }}" poster="{{ item.thumb }}"
                               style="object-position: {{ item.pos }};"
                               muted loop playsinline preload="none"></video>
                        <span class="me-play" aria-hidden="true"></span>
                    {% else %}
                        <img class="me-media" src="{{ item.thumb }}" alt="{{ item.alt }}"
                             style="object-position: {{ item.pos }};" loading="lazy" decoding="async">
                    {% endif %}
                </button>
            </figure>
        {% endfor %}
    </div>
</div>

<div class="me-lightbox" id="meLightbox" hidden>
    <button type="button" class="me-lightbox-close" aria-label="Close">&times;</button>
    <img id="meLightboxImage" src="" alt="" hidden>
    <video id="meLightboxVideo" controls loop playsinline hidden></video>
</div>

<div class="goose" id="goose" aria-hidden="true" hidden>
    <svg viewBox="0 0 100 92" width="100%" height="100%">
        <g class="goose-legs">
            <g class="goose-leg goose-leg-a">
                <rect x="31" y="58" width="4.5" height="22" rx="2" fill="#e07d18"/>
                <path d="M25 80 h16 l-3 5 h-10 Z" fill="#e07d18"/>
            </g>
            <g class="goose-leg goose-leg-b">
                <rect x="49" y="58" width="4.5" height="22" rx="2" fill="#ffa53d"/>
                <path d="M43 80 h16 l-3 5 h-10 Z" fill="#ffa53d"/>
            </g>
        </g>
        <g class="goose-body">
            <path d="M11 48 C4 40 13 31 21 36 Z" fill="#ffffff"/>
            <ellipse cx="39" cy="50" rx="29" ry="16" fill="#ffffff"/>
            <path d="M57 47 C65 34 66 20 67 12" stroke="#ffffff" stroke-width="11"
                  stroke-linecap="round" fill="none"/>
            <circle cx="68" cy="11" r="9.5" fill="#ffffff"/>
            <path d="M77 6 L98 11 L77 17 Z" fill="#ff8c1a"/>
            <circle cx="71" cy="7.5" r="2.2" fill="#242424"/>
        </g>
    </svg>
</div>
<script>
    (function () {
        var lightbox = document.getElementById("meLightbox");
        var lightImage = document.getElementById("meLightboxImage");
        var lightVideo = document.getElementById("meLightboxVideo");
        var closeBtn = lightbox.querySelector(".me-lightbox-close");
        var gridVideos = Array.prototype.slice.call(document.querySelectorAll(".me-card video"));
        var scrollY = 0;

        // Grid clips stay muted and only load once they scroll into view.
        function play(video) {
            if (!video.src) {
                video.src = video.getAttribute("data-src");
            }
            var started = video.play();
            if (started && started.catch) {
                started.catch(function () {});
            }
        }

        if ("IntersectionObserver" in window) {
            var observer = new IntersectionObserver(function (entries) {
                entries.forEach(function (entry) {
                    if (entry.isIntersecting) {
                        play(entry.target);
                    } else {
                        entry.target.pause();
                    }
                });
            }, { rootMargin: "100px" });
            gridVideos.forEach(function (video) { observer.observe(video); });
        } else {
            gridVideos.forEach(play);
        }

        function openItem(btn) {
            var src = btn.getAttribute("data-full");
            var alt = btn.getAttribute("data-alt") || "";

            if (btn.getAttribute("data-kind") === "video") {
                gridVideos.forEach(function (video) { video.pause(); });
                lightImage.hidden = true;
                lightVideo.hidden = false;
                lightVideo.src = src;
                lightVideo.muted = false;   // the click is the gesture that allows sound
                lightVideo.currentTime = 0;
                var started = lightVideo.play();
                if (started && started.catch) {
                    // Some browsers still refuse sound (iOS low power mode, for one).
                    // Fall back to a muted play so the clip runs and controls can unmute it.
                    started.catch(function () {
                        lightVideo.muted = true;
                        var retry = lightVideo.play();
                        if (retry && retry.catch) {
                            retry.catch(function () {});
                        }
                    });
                }
            } else {
                lightVideo.hidden = true;
                lightImage.hidden = false;
                lightImage.src = src;
                lightImage.alt = alt;
            }

            lightbox.hidden = false;
            scrollY = window.scrollY;
            document.body.classList.add("no-scroll");
            document.body.style.top = "-" + scrollY + "px";
        }

        function closeLightbox() {
            lightbox.hidden = true;
            lightImage.removeAttribute("src");
            lightVideo.pause();
            lightVideo.removeAttribute("src");
            lightVideo.load();
            document.body.classList.remove("no-scroll");
            document.body.style.top = "";
            window.scrollTo(0, scrollY);
            gridVideos.forEach(function (video) {
                if (video.src) { play(video); }
            });
        }

        // Fire-and-forget: a failed beacon must never affect the gallery.
        function trackClick(btn) {
            try {
                var meta = document.querySelector('meta[name="csrf-token"]');
                fetch("{% url 'track_click' %}", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": meta ? meta.getAttribute("content") : ""
                    },
                    body: JSON.stringify({
                        name: btn.getAttribute("data-name"),
                        kind: btn.getAttribute("data-kind")
                    }),
                    keepalive: true
                }).catch(function () {});
            } catch (err) {
                // ignored on purpose
            }
        }

        document.querySelectorAll(".me-card-btn").forEach(function (btn) {
            btn.addEventListener("click", function () {
                openItem(btn);
                trackClick(btn);
            });
        });

        closeBtn.addEventListener("click", closeLightbox);
        lightbox.addEventListener("click", function (event) {
            if (event.target === lightbox) closeLightbox();
        });
        document.addEventListener("keydown", function (event) {
            if (event.key === "Escape" && !lightbox.hidden) closeLightbox();
        });
    })();

    // Goose.
    (function () {
        var GOOSE_INTERVAL = 60000;
        var QUACK_SRC = "{{ quack_src }}";
        var goose = document.getElementById("goose");
        var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

        // Web Audio, not HTML <audio>: the gallery videos eat Safari/Chrome's
        // few media-element slots, so a reused Audio pool goes silent after
        // the clips have been looping (right around the first goose walk).
        var audioCtx = null;
        var quackBuffer = null;
        var quackBytes = null;

        function audioContext() {
            var AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return null;
            if (!audioCtx) audioCtx = new AC();
            return audioCtx;
        }

        function decodeQuack() {
            var ctx = audioContext();
            if (!ctx || !quackBytes || quackBuffer) return;
            var copy = quackBytes.slice(0);
            var done = function (buf) { quackBuffer = buf; };
            if (ctx.decodeAudioData.length === 1) {
                ctx.decodeAudioData(copy).then(done).catch(function () {});
            } else {
                ctx.decodeAudioData(copy, done, function () {});
            }
        }

        if (window.fetch) {
            fetch(QUACK_SRC).then(function (res) {
                return res.arrayBuffer();
            }).then(function (bytes) {
                quackBytes = bytes;
                decodeQuack();
            }).catch(function () {});
        }

        function playHtmlQuack() {
            var sound = new Audio(QUACK_SRC);
            var played = sound.play();
            if (played && played.catch) played.catch(function () {});
        }

        function quack() {
            try {
                var ctx = audioContext();
                if (ctx && ctx.state === "suspended") ctx.resume();
                if (ctx && quackBuffer) {
                    var src = ctx.createBufferSource();
                    src.buffer = quackBuffer;
                    src.connect(ctx.destination);
                    src.start(0);
                    return;
                }
                playHtmlQuack();
                decodeQuack();
            } catch (err) {
                try { playHtmlQuack(); } catch (ignored) {}
            }
        }

        document.querySelectorAll('.me-card-btn[data-kind="image"]').forEach(function (btn) {
            btn.addEventListener("click", quack);
        });

        // A different crossing every time: left or right, level or diagonal.
        var GOOSE_SIZE = 92;
        var walking = false;

        function route() {
            var vw = window.innerWidth;
            var vh = window.innerHeight;
            var offscreen = GOOSE_SIZE + 70;
            var lowest = Math.max(10, vh - GOOSE_SIZE - 10);
            var highest = Math.min(30, lowest);
            var rightward = Math.random() < 0.5;
            var startY, endY;

            if (Math.random() < 0.45) {
                // a level waddle along the lower part of the screen
                startY = endY = lowest - Math.random() * Math.min(70, lowest - highest);
            } else {
                // a diagonal, forced to be steep enough to read as one
                startY = highest + Math.random() * (lowest - highest);
                endY = highest + Math.random() * (lowest - highest);
                if (Math.abs(startY - endY) < vh * 0.22) {
                    endY = startY > (highest + lowest) / 2 ? highest : lowest;
                }
            }

            return {
                from: [rightward ? -offscreen : vw + offscreen, startY],
                to: [rightward ? vw + offscreen : -offscreen, endY],
                // the sprite is drawn facing right
                flip: rightward ? 1 : -1,
                duration: 1600 + Math.random() * 1600
            };
        }

        function walk() {
            if (!goose || walking || document.hidden || reduceMotion.matches) return;
            if (typeof goose.animate !== "function") return;

            var plan = route();
            walking = true;
            goose.hidden = false;

            var run = goose.animate([
                { transform: "translate(" + plan.from[0] + "px, " + plan.from[1] + "px) scaleX(" + plan.flip + ")" },
                { transform: "translate(" + plan.to[0] + "px, " + plan.to[1] + "px) scaleX(" + plan.flip + ")" }
            ], { duration: plan.duration, easing: "linear" });

            run.onfinish = function () {
                goose.hidden = true;
                walking = false;
            };
            run.oncancel = run.onfinish;
        }

        if (goose) {
            setInterval(walk, GOOSE_INTERVAL);
        }
    })();
</script>
{% endblock content %}
