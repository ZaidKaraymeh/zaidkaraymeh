{% extends 'base.html' %}

{% block me %}
    <li class="nav-item">
        <a class="nav-link active text-1 fs-5" href="{% url 'me' %}">Me </a>
    </li>
{% endblock me %}

{% block content %}
<div class="me-page">
    <div class="me-grid">
        {% for photo in photos %}
            <figure class="me-card">
                <button type="button" class="me-card-btn" data-full="{{ photo.src }}" aria-label="Open {{ photo.alt }}">
                    <img src="{{ photo.thumb }}" alt="{{ photo.alt }}" style="object-position: {{ photo.pos }};" loading="lazy" decoding="async">
                </button>
            </figure>
        {% endfor %}
    </div>
</div>

<div class="me-lightbox" id="meLightbox" hidden>
    <button type="button" class="me-lightbox-close" aria-label="Close photo">&times;</button>
    <img src="" alt="">
</div>
<script>
    (function () {
        var lightbox = document.getElementById("meLightbox");
        var image = lightbox.querySelector("img");
        var closeBtn = lightbox.querySelector(".me-lightbox-close");
        var scrollY = 0;

        function openPhoto(src, alt) {
            image.src = src;
            image.alt = alt || "";
            lightbox.hidden = false;
            scrollY = window.scrollY;
            document.body.classList.add("no-scroll");
            document.body.style.top = "-" + scrollY + "px";
        }

        function closePhoto() {
            lightbox.hidden = true;
            image.removeAttribute("src");
            document.body.classList.remove("no-scroll");
            document.body.style.top = "";
            window.scrollTo(0, scrollY);
        }

        document.querySelectorAll(".me-card-btn").forEach(function (btn) {
            btn.addEventListener("click", function () {
                openPhoto(btn.getAttribute("data-full"), btn.querySelector("img").alt);
            });
        });

        closeBtn.addEventListener("click", closePhoto);
        lightbox.addEventListener("click", function (event) {
            if (event.target !== image) closePhoto();
        });
        document.addEventListener("keydown", function (event) {
            if (event.key === "Escape" && !lightbox.hidden) closePhoto();
        });
    })();
</script>
{% endblock content %}
